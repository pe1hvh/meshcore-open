name: BBS Windows build

# Fork only: builds the Windows release of the BBS branch and keeps it
# as a downloadable zip on the run page. Not meant for upstream.
on:
  push:
    branches:
      - feature/bbs
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags needed for the installer version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - name: Download ONNX Runtime for flutter_onnxruntime
        # flutter_onnxruntime downloads ONNX Runtime inside CMake from
        # github.com/microsoft/onnxruntime without checking the result. Since
        # 17-11-2026 that download returns 404. This step puts ONNX Runtime in
        # the folder where the plugin looks first, so the plugin skips its own
        # download: from GitHub when that works again, otherwise from the
        # official NuGet package Microsoft.ML.OnnxRuntime (highest version of
        # the same major.minor, as NuGet lacks some patch releases),
        # rebuilt into the layout of the GitHub archive (include\ and lib\).
        # Keep ORT_VERSION equal to the default ONNXRUNTIME_VERSION of the
        # flutter_onnxruntime version in use.
        shell: pwsh
        env:
          ORT_VERSION: "1.28.3"
        run: |
          $name     = "onnxruntime-win-x64-$env:ORT_VERSION"
          $dir      = "build\windows\x64\plugins\flutter_onnxruntime\onnxruntime"
          $ghUrl    = "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/$name.zip"
          New-Item -ItemType Directory -Force $dir | Out-Null
          curl.exe -fL --retry 3 --retry-delay 5 -o "$dir\ort.zip" $ghUrl
          if ($LASTEXITCODE -eq 0) {
            tar -xf "$dir\ort.zip" -C $dir
            Remove-Item "$dir\ort.zip"
          } else {
            # NuGet does not carry every patch release: take the highest
            # version with the same major.minor (e.g. 1.28.x for 1.28.3).
            $minor = $env:ORT_VERSION.Substring(0, $env:ORT_VERSION.LastIndexOf('.'))
            $nv = (Invoke-RestMethod "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/index.json").versions |
                  Where-Object { $_ -match "^$([regex]::Escape($minor))\.\d+$" } |
                  Sort-Object { [version]$_ } | Select-Object -Last 1
            if (-not $nv) { throw "No $minor.x of Microsoft.ML.OnnxRuntime on NuGet" }
            $nugetUrl = "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/$nv/microsoft.ml.onnxruntime.$nv.nupkg"
            Write-Host "GitHub download failed, using NuGet $nv for ${name}: $nugetUrl"
            curl.exe -fL --retry 3 --retry-delay 5 -o "$dir\ort.nupkg" $nugetUrl
            if ($LASTEXITCODE -ne 0) { throw "NuGet download failed ($LASTEXITCODE): $nugetUrl" }
            New-Item -ItemType Directory -Force "$dir\nupkg", "$dir\$name\include", "$dir\$name\lib" | Out-Null
            tar -xf "$dir\ort.nupkg" -C "$dir\nupkg"
            Get-ChildItem -Recurse "$dir\nupkg\runtimes\win-x64", "$dir\nupkg\build\native\include" | Select-Object -ExpandProperty FullName
            Copy-Item "$dir\nupkg\build\native\include\*" "$dir\$name\include\" -Recurse
            Copy-Item "$dir\nupkg\runtimes\win-x64\native\*" "$dir\$name\lib\"
            Remove-Item -Recurse -Force "$dir\nupkg", "$dir\ort.nupkg"
          }
          foreach ($f in "include\onnxruntime_cxx_api.h", "lib\onnxruntime.lib", "lib\onnxruntime.dll") {
            if (-not (Test-Path "$dir\$name\$f")) { throw "$f missing in $dir\$name" }
          }
      - run: flutter build windows --release --no-pub
      - name: Add native assets and Visual C++ runtime DLLs
        shell: pwsh
        run: |
          $dst = "build\windows\x64\runner\Release"
          # Flutter builds the hook libraries (sqlite3, llamadart) into
          # build\native_assets\windows but does not bundle them in Release.
          # Without sqlite3.dll the app never reaches runApp().
          Copy-Item "build\native_assets\windows\*.dll" $dst
          if (-not (Test-Path "$dst\sqlite3.dll")) { throw "sqlite3.dll missing in $dst" }
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$dll" $dst
          }
      - uses: actions/upload-artifact@v4
        with:
          name: meshcore-open-bbs-windows-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          retention-days: 14
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = (git describe --tags --always) -replace '^v', ''
          $root = (Get-Location).Path
          & $iscc "/DAppVersion=$version" `
                  "/DSourceDir=$root\build\windows\x64\runner\Release" `
                  "/DOutputDir=$root\build\installer" `
                  "windows\installer\meshcore-open-bbs.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
      - uses: actions/upload-artifact@v4
        with:
          name: meshcore-open-bbs-windows-setup-${{ github.sha }}
          path: build/installer/*.exe
          retention-days: 14
